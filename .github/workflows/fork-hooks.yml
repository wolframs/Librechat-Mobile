# Fork-only workflow: fails when a hook line into upstream's files went missing or appeared without
# being registered. See fork/README.md.
name: Fork hooks

on:
  push:
    branches: [develop]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 fork/scripts/fork-hooks.py
